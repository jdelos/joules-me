design:
  theme: sb2nov
  header:
    connections:
      show_icons: true
      display_urls_instead_of_usernames: false
      hyperlink: true
  page:
    size: a4
    top_margin: 1.1cm
    bottom_margin: 1.0cm
    left_margin: 1.3cm
    right_margin: 1.3cm
    show_footer: false
    show_top_note: false
  colors:
    headline: "#EE2D2E"
    section_titles: "#EE2D2E"
    links: "#EE2D2E"
  typography:
    font_size:
      body: 10pt
      name: 25pt
      headline: 12pt
      connections: 9pt
      section_titles: 12.5pt
    line_spacing: 0.45em
  section_titles:
    space_above: 0.22cm
    space_below: 0.12cm
  sections:
    space_between_regular_entries: 0.19cm
    space_between_text_based_entries: 0.10cm
  entries:
    date_and_location_width: 5.3cm
    allow_page_break: false
    highlights:
      space_above: 0.04cm
      space_between_items: 0.03cm
locale:
  language: english
settings:
  current_date: "2026-11-11"
  render_command:
    output_folder: rendered
    dont_generate_html: false
    dont_generate_markdown: true
