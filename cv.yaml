# Accents: #text(maroon, weight: "bold")[...] (no nested parentheses, or RenderCV escapes it).
cv:
  name: Julià Delos Ayllón
  headline: Hardware and Software Engineer · Failed Entrepreneur · Linux Nerd · From Embbeded to Full-Stack
  location: Maastricht, Netherlands
  email: julidelos@gmail.com
  phone: +31 6 26 17 98 86
  social_networks:
    - network: LinkedIn
      username: jdelos
    - network: GitHub
      username: jdelos
  sections:
    Profile:
      - Seasoned engineer and failed entrepreneur with a PhD in Microelectronics, bringing together a deep understanding
        of hardware and software and a passion for building things. Enjoys turning theory into working systems and uses
        Blender to bring personal engineering and 3D printing projects to life. Eager to contribute this experience, curiosity,
        and Mediterranean passion to Blender’s development.
    Experience:
      - company: La Calçotada
        position: Founder
        start_date: 2019
        end_date: 2025
        location: Netherlands
        highlights:
          - 'Turned a yearly food festival into a food-experience business serving up to
            #text(maroon, weight: "bold")[10,000 users] across the Netherlands and seven
            neighbouring countries, building the e-commerce flow, logistics and supplier network.'
          - 'Generated #text(maroon, weight: "bold")[EUR 100k+] in online sales during the
            initial market validation phase, reaching a peak run-rate of around
            #text(maroon, weight: "bold")[EUR 20k/month], with gross margins above
            #text(maroon, weight: "bold")[40%] and approximately
            #text(maroon, weight: "bold")[3%] e-commerce conversion.'
          - 'Partnered with restaurants in Amsterdam, Eindhoven and Tilburg to host around
            #text(maroon, weight: "bold")[200 guests] per afternoon during otherwise quiet
            or closed hours, generating approximately
            #text(maroon, weight: "bold")[EUR 19 per guest] for each restaurant.'
          - "Built an equity-crowdfunding platform intended to give the community ownership
            of the business, applying open-source principles to an open business model;
            the initiative failed at the go-to-market stage."
      - company: Ripatrip
        position: Co-Founder and CTO
        start_date: 2019-09
        end_date: 2020-06
        location: Remote (team in Portugal)
        highlights:
          - 'Co-founded a travel search platform supported by
            #text(maroon, weight: "bold")[Startup Lisboa], initially focused
            on kitesurfing and later expanded to ski and snowboard destinations.'
          - 'Delivered a working demo within #text(maroon, weight: "bold")[two weeks]
            and presented it at #text(maroon, weight: "bold")[Web Summit 2019 in Lisbon].
            Guided #text(maroon, weight: "bold")[two junior developers] through further development.'
          - 'Enabled travel searches across #text(maroon, weight: "bold")[5,000 destinations]
            by integrating multiple APIs for destination data and travel offerings.'
          - "Built the platform with React-Gatsby/Redux and a CMS as the only backend,
            querying flight, accommodation, and destination data directly
            from the client in real time."

      - company: ICT Group
        position: Innovation and Technology Consultant
        start_date: 2016-09
        end_date: 2018-09
        location: Eindhoven, Netherlands
        highlights:
          - "Worked closely with the C-suite to introduce visual business modelling
            tools across business units, creating a shared language for strategy
            and innovation."
          - 'Convinced senior leadership to establish a
            #text(maroon, weight: "bold")[dedicated data-science team and data lake]
            by showing business-unit leaders how data science could benefit their units.'
          - 'Coached around #text(maroon, weight: "bold")[10 developer-led teams]
            for the internal Dragons'' Den, using experiments to validate
            technical ideas and customer value.'

      - company: Philips Research
        position: Research Scientist
        start_date: 2011-06
        end_date: 2015-12
        location: Eindhoven, Netherlands
        highlights:
          - Surpassed state-of-the-art integrated power density by developing a new
            power-system-on-chip LED driver.
          - Enabled chip-area optimization by creating a design framework based on a closed-form
            model, validated theoretically and experimentally.
          - 'Expanded Philips’ patent portfolio through circuit inventions resulting in
            #text(maroon, weight: "bold")[8 first-named EPO patent records (6 granted)].'
          - Completed a PhD with Eindhoven University of Technology, publishing peer-reviewed
            research and presenting internationally.

      - company: Lear Corporation
        position: Hardware Engineer
        start_date: 2010-03
        end_date: 2011-05
        location: Valls, Spain
        highlights:
          - 'Delivered a #text(maroon, weight: "bold")[60 kW] racing-car inverter that worked
            on its first iteration by leading hardware design, test setup, and production.'
          - Met an inverter volume target considered infeasible by coordinating suppliers
            and technical contributors.
          - 'Reduced current-sensor cost to #text(maroon, weight: "bold")[one-sixth]
            by designing an in-house, low-profile tangential sensor with adjustable
            sensitivity and high accuracy.'
      - company: HP (via Capgemini)
        position: Embedded Systems Engineer, Printer Firmware
        start_date: 2006-09
        end_date: 2007-09
        location: Barcelona
        highlights:
          - 'Delivered production fixes within the #text(maroon, weight: "bold")[first month]
            in a large C/C++ and Java codebase spanning Linux and distributed ARM targets,
            with a #text(maroon, weight: "bold")[six-hour full build].'
          - Resolved longstanding firmware issues by applying hardware expertise
            beyond the software team’s capabilities.
          - Managed builds, release packaging, and security updates for HP’s
            top-of-the-line large-format printers using ClearCase.
          - 'Transferred firmware knowledge to the Bangalore team through
            #text(maroon, weight: "bold")[two-to-three weeks] of hands-on training.'

    Education:
      - institution: Eindhoven University of Technology
        area: Electrical Engineering
        degree: PhD
        date: 2016
      - institution: Technical University of Catalonia
        area: Electronics Engineering
        degree: MSc
        date: 2010
      - institution: Polytech Lille
        area: Industrial Software Development
        degree: BSc
        date: 2006
      - institution: Technical University of Catalonia
        area: Electrical Engineering
        degree: BSc
        date: 2005
    Languages:
      - Native Catalan and Spanish · Proficient in English and French · Conversational in Portuguese
        and Dutch
    Projects:
      - name: Switched-capacitor converter impedance tools
        highlights:
          - 'Porting my MATLAB converter models to C++ (SymEngine) and
            #text(maroon, weight: "bold")[WebAssembly]; GitHub Actions builds the pinned library
            and checks the native and WebAssembly results against MATLAB.'
      - name: Onion Memorandum platform
        start_date: 2024-07
        end_date: 2025-03
        highlights:
          - Remix (Epic Stack) application with Prisma migrations, MDX content and PDF generation,
            tested with Vitest and Playwright and deployed with Docker on Fly.io via GitHub Actions.
      - name: QR ticketing app and ticket reader
        start_date: 2023-11
        end_date: 2024-03
        highlights:
          - Shopify app that issues QR-code tickets as PDFs, plus a Remix scanner app built on
            XState; tested with Cypress and Vitest, deployed with Docker on Fly.io.
      - name: Aircraft power converter, Polytechnic Institute of New York University
        start_date: 2009-02
        end_date: 2009-12
        highlights:
          - 'As a research visitor, designed and modelled a #text(maroon, weight: "bold")[20 kW]
            fuel-cell converter providing ±270 V rails for a universal power-converter research
            system.'
      - name: Embedded and real-time internships, Renault Technocentre, LAGIS and INRETS
        start_date: 2005-02
        end_date: 2006-07
        highlights:
          - Benchmarked vehicle-speed estimators on dSPACE real-time hardware with MATLAB/Simulink
            (Renault).
          - Wrote a CAN network sniffer in C on Linux/RTAI for the Robucar vehicle and the developer
            manual for SynDEx, a tool for distributed real-time embedded systems (LAGIS).
          - Designed an electronic system to detect electromagnetic perturbations in antenna EMC
            test setups (INRETS).
design:
  theme: harvard
  page:
    size: a4
    top_margin: 1.1cm
    bottom_margin: 1.0cm
    left_margin: 1.3cm
    right_margin: 1.3cm
    show_footer: false
    show_top_note: false
  colors:
    headline: rgb(31, 58, 95)
    section_titles: rgb(31, 58, 95)
    links: rgb(31, 58, 95)
  typography:
    font_size:
      body: 9.1pt
      name: 25pt
      headline: 10pt
      connections: 9pt
      section_titles: 12.5pt
    line_spacing: 0.45em
  section_titles:
    space_above: 0.22cm
    space_below: 0.12cm
  sections:
    space_between_regular_entries: 0.19cm
    space_between_text_based_entries: 0.08cm
  entries:
    date_and_location_width: 5.3cm
    allow_page_break: false
    highlights:
      space_above: 0.04cm
      space_between_items: 0.03cm
locale:
  language: english
settings:
  current_date: "2026-11-11"
  render_command:
    output_folder: rendered
    dont_generate_html: true
    dont_generate_markdown: true
